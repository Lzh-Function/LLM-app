# Compatibility alias for flash-next; prefer codex -p flash-next.
# Optional profile: codex -p flash-next. Start ./llm codex flash-next in another terminal first.
model = "qwen3.8-flash-next-sc117-abliterated-iq3_xxs"
model_provider = "strata"
model_catalog_json = "@CODEX_HOME@/flash-next-models.json"
model_context_window = 131072
model_auto_compact_token_limit = 98304
model_reasoning_effort = "high"
show_raw_agent_reasoning = true
sandbox_mode = "workspace-write"
web_search = "live"

[sandbox_workspace_write]
network_access = true

[model_providers.strata]
name = "Strata (local Flash Next)"
base_url = "http://127.0.0.1:8080/v1"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false
stream_idle_timeout_ms = 600000

# Optional local-provider feature settings.
[features]
apps = false
multi_agent = false

[mcp_servers.local_web_search]
command = "@ROOT@/codex/search-mcp/.venv/bin/python"
args = ["@ROOT@/codex/search-mcp/server.py"]
startup_timeout_sec = 30
tool_timeout_sec = 45
enabled = true
required = true
enabled_tools = ["web_search", "fetch_page"]
