# Optional profile: codex -p bonsai. Start serve-codex.sh in another terminal first.
model = "ternary-bonsai-2-27b-abliterated"
model_provider = "prism"
model_catalog_json = "@CODEX_HOME@/bonsai-models.json"
model_context_window = 98304
model_auto_compact_token_limit = 73728
model_reasoning_effort = "medium"
show_raw_agent_reasoning = true
sandbox_mode = "workspace-write"
web_search = "live"

[sandbox_workspace_write]
network_access = true

[model_providers.prism]
name = "Prism (local Bonsai 2)"
base_url = "http://127.0.0.1:8081/v1"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false
stream_idle_timeout_ms = 1800000

# Optional local-provider feature settings.
[features]
apps = false
multi_agent = false

[mcp_servers.local_web_search]
command = "@ROOT@/codex/search-mcp/.venv/bin/python"
args = ["@ROOT@/codex/search-mcp/server.py"]
startup_timeout_sec = 30
tool_timeout_sec = 45
enabled = true
required = true
enabled_tools = ["web_search", "fetch_page"]
